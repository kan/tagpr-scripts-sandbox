name: tagpr

# **取り込み先の tagpr.yml から呼ぶ reusable workflow（issue #6）。** リリース PR を作り直し、
# マージされたらタグを打って、取り込み先の publish / release を起動する。この repo では動かない
# （`workflow_call` しか持たない）。
#
# 呼び方（取り込み先の `.github/workflows/tagpr.yml`）:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   permissions:
#     contents: read
#   jobs:
#     tagpr:
#       uses: kan/tagpr-scripts/.github/workflows/tagpr.yml@<commit の SHA>
#       permissions:
#         contents: write
#         pull-requests: write
#         issues: read
#         actions: write
#       with:
#         release-workflow: release.yml
#
# - **呼ぶ行は commit の SHA で書く。** 別の repo の reusable workflow を呼ぶ行は、呼ぶ側の
#   actions.lock では固定されない。SHA は `scripts/tagpr/` の subtree と同じ commit に揃え、
#   subtree pull のときに一緒に上げる。この workflow の中の action（tagpr など）は、この repo の
#   actions.lock が固定する
# - 呼ぶジョブの `permissions` が、ここのジョブの権限の上限になる。上の 4 つを書く
# - `github.repository` や checkout の対象は、呼んだ側の repo になる
#
# 動き:
#
# - main への push ごとに、リリース PR（ブランチ `tagpr-from-v<前の版>`）を main の上に作り直す。
#   版のファイルは tagpr が書き換え、CHANGELOG と lock は `.tagpr` の postVersionCommand
#   （`scripts/tagpr/release-prepare.mjs`）が直す
# - リリース PR がマージされると、次の run がマージコミットにタグを打ち、`release` ジョブが
#   `release-workflow` をそのタグで起動する
# - 取り込み先の `workflow_dispatch` は、リリース PR の作り直し用（`tagpr:minor` を付けた後など）
on:
  workflow_call:
    inputs:
      release-workflow:
        description: >-
          タグを打った後に、そのタグを ref にして起動するワークフローのファイル名（publish.yml など）。
          空なら起動しない（起動の前に別のジョブを挟む repo は、自分で起動する）
        type: string
        default: ''
      artifact:
        description: >-
          同じ run の前のジョブが作った artifact の名前（クレジットなど）。tagpr の前に
          `$RUNNER_TEMP/tagpr-artifact` へ落とし、そのディレクトリを環境変数 TAGPR_ARTIFACT_DIR で
          postVersionCommand に渡す。落とせなかったときは TAGPR_ARTIFACT_DIR を設定しない
        type: string
        default: ''
      node-version:
        description: >-
          postVersionCommand に使う Node の版（setup-node に渡す）。空ならランナーに入っている Node を使う
        type: string
        default: ''
      timeout-minutes:
        description: tagpr のジョブの timeout
        type: number
        default: 10
    outputs:
      tag:
        description: この run で打ったタグ（vX.Y.Z）。打たなかったときは空
        value: ${{ jobs.tagpr.outputs.tag }}

permissions:
  contents: read

jobs:
  tagpr:
    name: Prepare the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # **並べず、止めない。** 並べると同じブランチを作り直し合う。止めると、タグを打った直後に
    # 止まって publish されないタグが残る。group は呼んだ側の repo ごとに分かれる。
    #
    # それでも GitHub は待っている run を 1 つしか持たない。リリース PR のマージの run が
    # 待っている間に push が来ると、その run は cancelled になりタグが打たれない。後の push の
    # run は `release-prepare.mjs` の検査（最新のタグより新しい版の節がある）で赤になるので、
    # マージコミットの run を再実行する（tagpr-scripts の README）。新しいリリース PR をマージして
    # やり過ごさない
    concurrency:
      group: tagpr
      cancel-in-progress: false
    permissions:
      contents: write       # リリース PR のブランチとタグを push する
      pull-requests: write  # リリース PR を作る・更新する
      issues: read          # ラベルを読む
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # **依存のコードを走らせない。** このジョブは push できるトークンを持つ。`npm ci` などは
      # せず、依存のコードが要るもの（クレジットなど）は、書き込みの権限を持たない前のジョブで
      # 作って `artifact` で渡す。`scripts/tagpr/` は Node の組み込みだけで動く
      - if: inputs.node-version != ''
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      # 前のジョブが落ちても、tagpr は走らせる（呼ぶ側は `if: ${{ !cancelled() }}` を付ける）。
      # リリース PR のマージの run はタグを打つだけで artifact を使わないので、一時的な失敗で
      # タグを打ち損ねないようにする。リリース PR を作り直す run は、TAGPR_ARTIFACT_DIR が無いので
      # postVersionCommand が何も書き換えずに落ちる（取り込み先のラッパーがそう作る）
      - if: inputs.artifact != ''
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/tagpr-artifact
      - if: steps.artifact.outcome == 'success'
        run: echo "TAGPR_ARTIFACT_DIR=$RUNNER_TEMP/tagpr-artifact" >> "$GITHUB_ENV"

      # **tagpr の commit は、この repo の actions.lock が固定する。** 書き込みの権限で動く
      # 第三者の action なので、タグが付け替えられても、記録した commit 以外は動かさない
      - name: Run tagpr
        id: tagpr
        uses: Songmu/tagpr@v1.21.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # **GITHUB_TOKEN で push したタグでは `push: tags` が起動しない。** `workflow_dispatch` は
  # その例外なので、タグを ref にして起動する。`workflow_call` で同じ run から呼ばない。そうすると
  # run の ref が main になり、OIDC のトークンも provenance も attestation もそれを名乗る
  # （npm の Trusted Publisher は publish のワークフローのファイルで判定する）。
  #
  # 起動だけが失敗したとき（タグは打たれている）は、tagpr の run を再実行せず、
  # `gh workflow run <release-workflow> --ref vX.Y.Z` で手で起動する
  release:
    name: Start the release
    needs: tagpr
    if: needs.tagpr.outputs.tag != '' && inputs.release-workflow != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # workflow_dispatch
    steps:
      - name: Dispatch ${{ inputs.release-workflow }} on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}
          WORKFLOW: ${{ inputs.release-workflow }}
        run: gh workflow run "$WORKFLOW" --ref "$TAG"
