name: release

# 共通の tagpr workflow が、打ったタグを ref にして起動する。何も公開せず、起動されたことと
# ref がタグであることを確かめるだけ。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Show the ref and the notes
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "ref: $REF"
          case "$REF" in refs/tags/v*) ;; *) echo "::error::not a tag: $REF"; exit 1 ;; esac
          node scripts/tagpr/release-notes.mjs "$TAG"
