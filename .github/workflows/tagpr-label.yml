name: tagpr-label

# リリース PR のラベルを付け外ししたら、tagpr.yml で作り直す（kan/tagpr-scripts#3）
on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions: {}

jobs:
  rebuild:
    uses: kan/tagpr-scripts/.github/workflows/tagpr-label.yml@bab0c0874266ab8e62a2cc9a5d1c8a692ea40ce9
    permissions:
      actions: write        # tagpr.yml を起動する
      pull-requests: write  # リリース PR を draft にする
