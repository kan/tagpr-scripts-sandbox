name: tagpr-label

# リリース PR のラベルを付け外ししたら、tagpr.yml で作り直す（kan/tagpr-scripts#3）
on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions: {}

jobs:
  rebuild:
    uses: kan/tagpr-scripts/.github/workflows/tagpr-label.yml@cbbe9209e6187bd31e505d4023419392de45d23a
    permissions:
      actions: write        # tagpr.yml を起動する
      pull-requests: write  # リリース PR を draft にする
