name: tagpr-label

# リリース PR のラベルを付け外ししたら、tagpr.yml で作り直す（kan/tagpr-scripts#3）
on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions: {}

jobs:
  rebuild:
    uses: kan/tagpr-scripts/.github/workflows/tagpr-label.yml@19aa97635f98840e03898fd4ffe74d6925cfe7bf
    permissions:
      actions: write        # tagpr.yml を起動する
      pull-requests: write  # リリース PR を draft にする
