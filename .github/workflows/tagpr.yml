name: tagpr

# kan/tagpr-scripts の共通の tagpr workflow を呼ぶ（kan/tagpr-scripts#6 の試し）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 書き込みの権限を持たないジョブで、依存のコードが要るもの（ここでは CREDITS の代わり）を作る
  credits:
    name: Generate CREDITS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate CREDITS
        run: |
          mkdir -p "$RUNNER_TEMP/credits"
          echo "generated by run $GITHUB_RUN_ID" > "$RUNNER_TEMP/credits/CREDITS"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: credits
          path: ${{ runner.temp }}/credits/CREDITS
          retention-days: 1
          if-no-files-found: error

  tagpr:
    needs: credits
    # credits が落ちても、マージの run がタグを打てるようにする
    if: ${{ !cancelled() }}
    uses: kan/tagpr-scripts/.github/workflows/tagpr.yml@e6ffc038b4541918cff4f18e52729d18757307d3
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    with:
      release-workflow: release.yml
      artifact: credits
