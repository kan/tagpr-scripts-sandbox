name: tagpr

# kan/tagpr-scripts の共通の tagpr workflow を呼ぶ（kan/tagpr-scripts#6 の試し）。
on:
  push:
    branches: [main]
  # リリース PR に tagpr:minor / tagpr:major を付け外ししたら作り直す（kan/tagpr-scripts#3 の試し）。
  # pull_request_target は既定のブランチの上で走るので、tagpr はリリースのブランチの上で動く。
  # PR の中身は checkout しない
  pull_request_target:
    types: [labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 書き込みの権限を持たないジョブで、依存のコードが要るもの（ここでは CREDITS の代わり）を作る
  credits:
    name: Generate CREDITS
    # pull_request_target では、この repo のリリース PR の版のラベルの付け外しだけで走る
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'tagpr-from-v') &&
       (github.event.label.name == 'tagpr:minor' || github.event.label.name == 'tagpr:major'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate CREDITS
        run: |
          mkdir -p "$RUNNER_TEMP/credits"
          echo "generated by run $GITHUB_RUN_ID" > "$RUNNER_TEMP/credits/CREDITS"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: credits
          path: ${{ runner.temp }}/credits/CREDITS
          retention-days: 1
          if-no-files-found: error

  tagpr:
    needs: credits
    # credits が落ちても、マージの run がタグを打てるようにする。pull_request_target の絞り込みは
    # credits と同じ（credits が skipped でも `!cancelled()` だけでは走ってしまう）
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'tagpr-from-v') &&
        (github.event.label.name == 'tagpr:minor' || github.event.label.name == 'tagpr:major')))
    uses: kan/tagpr-scripts/.github/workflows/tagpr.yml@c2b813c5ac07d8c09c4d75f70aa317dc0338eb7b
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    with:
      release-workflow: release.yml
      artifact: credits
